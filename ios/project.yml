name: NOVA
options:
  bundleIdPrefix: com.antigravity
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  SWIFT_VERSION: "6.0"
  ENABLE_PREVIEWS: YES
  DEVELOPMENT_TEAM: "" # Set your Apple Developer Team ID here or in Xcode

targets:
  NOVA:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: NOVA
    info:
      path: NOVA/Info.plist
      properties:
        CFBundleDisplayName: NOVA
        CFBundleShortVersionString: "0.4.0"
        CFBundleVersion: "1"
        NSLocalNetworkUsageDescription: "NOVA requires access to your local Wi-Fi network to connect securely to your Windows PC host agent."
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.antigravity.nova.ios
      INFOPLIST_FILE: NOVA/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      GENERATE_INFOPLIST_FILE: NO

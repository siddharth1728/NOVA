version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: sih26122_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sih26122_db}
      POSTGRES_USER: ${POSTGRES_USER:-sih_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sih_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sih_user} -d ${POSTGRES_DB:-sih26122_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
